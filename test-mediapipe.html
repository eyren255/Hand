<!DOCTYPE html>
<html>
<head>
    <title>MediaPipe Test</title>
</head>
<body>
    <h1>Testing MediaPipe Hands</h1>

            console.log('Window keys:', Object.keys(window).filter(k => k.includes('Hand') || k.includes('Camera')));

            console.log('window.Camera:', window.Camera);
        }, 2000);
    </script>
